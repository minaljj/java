<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>TODO LIST</title>
    <link rel="stylesheet" href="style.css">
</head>


<body>
    <div>
        <h2>TODO App</h2>

        <input type="text" onkeyup="validate()" id="todo-input" placeholder="Enter task...">
        <input type="number" id="todo-time" placeholder="Enter Time">
        <button onclick="addTODO()">Add</button>
        <button onclick="sort()">sort</button>

        <div class="error" id="error">Name is mandatory</div>
        <div class="priority">
            <label>
                <input type="radio" name="priority" value="urgent">urgent

            </label>
            <label>
                <input type="radio" name="priority" value="normal" checked>Not urgent

            </label>
        </div>
        <ul id="todo-list"></ul>
    </div>
</body>
<script src="app.js"></script>

</html>
